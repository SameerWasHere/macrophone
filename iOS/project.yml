name: Macrophone
options:
  bundleIdPrefix: com.sameer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 8523EX5882
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  MacrophoneKit:
    path: ../Packages/MacrophoneKit
targets:
  Macrophone:
    type: application
    platform: iOS
    sources:
      - path: Macrophone
      - path: Shared
    dependencies:
      - package: MacrophoneKit
      - target: MacrophoneControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sameer.macrophone
        PRODUCT_NAME: Macrophone
        # iPhone only. Set per target: XcodeGen gives every iOS target "1,2" (iPad too), which
        # beats the project-level value and would ship a universal app needing iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MACROPHONE_APP"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    entitlements:
      path: Macrophone/Macrophone.entitlements
      properties:
        # The app's own group stays first (the default for new items: the pairing key stays private);
        # the shared one only holds the targets list for the Control Center control.
        # (Not an App Group: the wildcard team profile can't carry one.)
        keychain-access-groups: [$(AppIdentifierPrefix)com.sameer.macrophone, $(AppIdentifierPrefix)com.sameer.macrophone.shared]
    info:
      path: Macrophone/Info.plist
      properties:
        CFBundleDisplayName: Macrophone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MacrophoneSharedKeychainGroup: $(AppIdentifierPrefix)com.sameer.macrophone.shared
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSMicrophoneUsageDescription: Macrophone listens only while you tap or hold the mic button, to turn your speech into text. No audio is kept.
        NSSpeechRecognitionUsageDescription: Your speech is turned into text on this iPhone. It isn't sent to Apple or anyone else.
        NSCameraUsageDescription: The camera is used only to scan the pairing code shown on your Mac.
        NSLocalNetworkUsageDescription: Macrophone finds your Mac on this network and sends it your text directly. Nothing goes to the internet.
        NSBonjourServices: [_macrophone._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: com.sameer.macrophone
            CFBundleURLSchemes: [macrophone]
  MacrophoneControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MacrophoneControls
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sameer.macrophone.controls
        PRODUCT_NAME: MacrophoneControls
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    entitlements:
      path: MacrophoneControls/MacrophoneControls.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.sameer.macrophone.shared]
    info:
      path: MacrophoneControls/Info.plist
      properties:
        CFBundleDisplayName: Macrophone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MacrophoneSharedKeychainGroup: $(AppIdentifierPrefix)com.sameer.macrophone.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MacrophoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MacrophoneUITests
    dependencies:
      - target: Macrophone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sameer.macrophone.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Macrophone:
    build:
      targets:
        Macrophone: all
    test:
      targets:
        - MacrophoneUITests
    run:
      config: Debug
    archive:
      config: Release
