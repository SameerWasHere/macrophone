<h1>Macrophone 1.1.2</h1>
<p class="sub">The pointer on your iPhone looks like your Mac's.</p>
<ul>
  <li>The trackpad's pointer on your iPhone changes shape as it does on your Mac: a text cursor over text, a pointing hand over links and buttons, resize arrows at a window's edge. It's smaller, too.</li>
  <li>A smoother app icon.</li>
</ul>
