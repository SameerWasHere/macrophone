<h1>Macrophone 1.1.6</h1>
<p class="sub">Windows open at your iPhone's shape.</p>
<ul>
  <li>A window you open on your iPhone takes its shape before the first picture, so it opens ready, with no jump half a second in.</li>
  <li>When your iPhone folds or turns, the window reshapes out of sight and shows once it has settled.</li>
</ul>
