name: Macrophone
options:
  bundleIdPrefix: com.sameer.macrophone
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MacrophoneKit:
    path: ../Packages/MacrophoneKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    DEVELOPMENT_TEAM: 8523EX5882
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Macrophone:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: MacrophoneKit
        product: MacrophoneKit
      - package: Sparkle
        product: Sparkle
      - target: macrophone-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Alerts through iCloud need a profile with the iCloud container ("Macrophone Mac iCloud
        # Developer ID"): a build signed with it passes MACROPHONE_ENTITLEMENTS_FILE=
        # Resources/Macrophone-iCloud.entitlements, MACROPHONE_CLOUD_ALERTS=YES and the profile
        # (release.sh does). The app target only; the command-line tool signs as before.
        MACROPHONE_ENTITLEMENTS_FILE: Resources/Macrophone.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MACROPHONE_ENTITLEMENTS_FILE)
        MACROPHONE_CLOUD_ALERTS: "NO"
        MACROPHONE_CLOUD_ENVIRONMENT: Production
        MACROPHONE_SIGN_STYLE: Automatic
        CODE_SIGN_STYLE: $(MACROPHONE_SIGN_STYLE)
        MACROPHONE_APP_PROFILE: ""
        PROVISIONING_PROFILE_SPECIFIER: $(MACROPHONE_APP_PROFILE)
        MACROPHONE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_IDENTITY: $(MACROPHONE_SIGN_IDENTITY)
        # The icon is Resources/AppIcon.icon (Icon Composer, Liquid Glass on macOS 26+; picked up
        # from the Resources folder as wrapper.icon) and Assets.xcassets/AppIcon.appiconset (the
        # squircle PNGs for macOS 14–15) — the same name, so Xcode takes the .icon and keeps the
        # set for older releases. Both come from scripts/render-sky-icon.swift (scripts/sky-icon.sh).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          # A debug build never collides with an installed release copy.
          PRODUCT_NAME: Macrophone Debug
          PRODUCT_BUNDLE_IDENTIFIER: com.sameer.macrophone.mac.debug
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          PRODUCT_NAME: Macrophone
          PRODUCT_BUNDLE_IDENTIFIER: com.sameer.macrophone.mac

  macrophone-cli:
    type: tool
    platform: macOS
    sources:
      - path: CLI
        excludes:
          - "Info.plist"
    dependencies:
      - package: MacrophoneKit
        product: MacrophoneKit
    settings:
      base:
        PRODUCT_NAME: macrophone
        PRODUCT_BUNDLE_IDENTIFIER: com.sameer.macrophone.cli
        INFOPLIST_FILE: CLI/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: NO

schemes:
  Macrophone:
    build:
      targets:
        Macrophone: all
        macrophone-cli: all
    run:
      config: Debug
    archive:
      config: Release
